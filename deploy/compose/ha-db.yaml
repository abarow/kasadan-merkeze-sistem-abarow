# Docker test of the headquarters database on three machines (docs/decisions/HA-HEADQUARTERS.md):
# every "machine" has an etcd, a PostgreSQL with Patroni and an HAProxy. scripts/ha-db-test.sh
# starts it, shuts machines down and checks that no acknowledged write is lost.
#
# The passwords are trial values the test script writes (ABAROW_HA_SECRETS); between the
# machines nothing is encrypted here: in a real install etcd, Patroni and the replication
# go over TLS (HA-HEADQUARTERS.md step 4).
name: abarow-ha

# The environment is written out per machine: a merge key does not merge maps inside.
x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.6.14

x-db: &db
  image: abarow-patroni:dev
  build:
    context: ../..
    dockerfile: deploy/container/patroni.Containerfile
  secrets:
    - db-password
    - replication-password
  # The base settings of headquarters for one store (as in headquarters.yaml).
  command: ["-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=16MB", "-c", "wal_buffers=2MB", "-c", "effective_cache_size=88MB", "-c", "random_page_cost=1.1", "-c", "min_wal_size=32MB", "-c", "max_wal_size=256MB", "-c", "checkpoint_completion_target=0.9", "-c", "autovacuum_max_workers=2", "-c", "max_worker_processes=4", "-c", "max_parallel_workers=0", "-c", "max_parallel_workers_per_gather=0", "-c", "max_parallel_maintenance_workers=0", "-c", "archive_mode=on", "-c", "archive_library=basic_archive", "-c", "basic_archive.archive_directory=/var/lib/postgresql", "-c", "archive_timeout=15min", "-c", "log_min_duration_statement=1s", "-c", "log_lock_waits=on", "-c", "log_autovacuum_min_duration=10s", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.max=1000", "-c", "track_io_timing=on"]

x-proxy: &proxy
  image: haproxy:3.2-alpine
  volumes:
    - ./ha-db/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

services:
  etcd-1:
    <<: *etcd
    container_name: ha-etcd-1
    environment:
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://ha-etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://ha-etcd-1:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://ha-etcd-1:2380,etcd-2=http://ha-etcd-2:2380,etcd-3=http://ha-etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: abarow-headquarters
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_DATA_DIR: /etcd-data
  etcd-2:
    <<: *etcd
    container_name: ha-etcd-2
    environment:
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://ha-etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://ha-etcd-2:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://ha-etcd-1:2380,etcd-2=http://ha-etcd-2:2380,etcd-3=http://ha-etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: abarow-headquarters
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_DATA_DIR: /etcd-data
  etcd-3:
    <<: *etcd
    container_name: ha-etcd-3
    environment:
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://ha-etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://ha-etcd-3:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://ha-etcd-1:2380,etcd-2=http://ha-etcd-2:2380,etcd-3=http://ha-etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: abarow-headquarters
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_DATA_DIR: /etcd-data

  db-1:
    <<: *db
    container_name: ha-db-1
    environment: { ABAROW_NODE: hq-1, ABAROW_NODE_ADDRESS: ha-db-1, ABAROW_ETCD: "ha-etcd-1:2379,ha-etcd-2:2379,ha-etcd-3:2379" }
    depends_on: [etcd-1, etcd-2, etcd-3]
  db-2:
    <<: *db
    container_name: ha-db-2
    environment: { ABAROW_NODE: hq-2, ABAROW_NODE_ADDRESS: ha-db-2, ABAROW_ETCD: "ha-etcd-1:2379,ha-etcd-2:2379,ha-etcd-3:2379" }
    depends_on: [etcd-1, etcd-2, etcd-3]
  db-3:
    <<: *db
    container_name: ha-db-3
    environment: { ABAROW_NODE: hq-3, ABAROW_NODE_ADDRESS: ha-db-3, ABAROW_ETCD: "ha-etcd-1:2379,ha-etcd-2:2379,ha-etcd-3:2379" }
    depends_on: [etcd-1, etcd-2, etcd-3]

  proxy-1:
    <<: *proxy
    container_name: ha-proxy-1
  proxy-2:
    <<: *proxy
    container_name: ha-proxy-2
  proxy-3:
    <<: *proxy
    container_name: ha-proxy-3

secrets:
  db-password:
    file: ${ABAROW_HA_SECRETS:?ABAROW_HA_SECRETS is not set}/db-password
  replication-password:
    file: ${ABAROW_HA_SECRETS:?ABAROW_HA_SECRETS is not set}/replication-password
