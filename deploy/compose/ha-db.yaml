# Docker test of the headquarters database on three machines (docs/decisions/HA-HEADQUARTERS.md):
# every "machine" has an etcd, a PostgreSQL with Patroni and an HAProxy. scripts/ha-db-test.sh
# starts it, shuts machines down and checks that no acknowledged write is lost.
#
# Between the machines everything is TLS, as in a real install: every machine has a certificate
# of headquarters' CA (natsauth -role headquarters; the test script produces them under
# ABAROW_HA_SECRETS/m1..m3) whose names are the machine's containers. The passwords are trial
# values the test script writes.
name: abarow-ha

x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.6.14

x-db: &db
  image: abarow-patroni:dev
  build:
    context: ../..
    dockerfile: deploy/container/patroni.Containerfile
  secrets:
    - db-password
    - replication-password
    - restapi-password
  # The base settings of headquarters for one store (as in headquarters.yaml).
  command: ["-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=16MB", "-c", "wal_buffers=2MB", "-c", "effective_cache_size=88MB", "-c", "random_page_cost=1.1", "-c", "min_wal_size=32MB", "-c", "max_wal_size=256MB", "-c", "checkpoint_completion_target=0.9", "-c", "autovacuum_max_workers=2", "-c", "max_worker_processes=4", "-c", "max_parallel_workers=0", "-c", "max_parallel_workers_per_gather=0", "-c", "max_parallel_maintenance_workers=0", "-c", "archive_mode=on", "-c", "archive_library=basic_archive", "-c", "basic_archive.archive_directory=/var/lib/postgresql", "-c", "archive_timeout=15min", "-c", "log_min_duration_statement=1s", "-c", "log_lock_waits=on", "-c", "log_autovacuum_min_duration=10s", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.max=1000", "-c", "track_io_timing=on"]

x-proxy: &proxy
  image: haproxy:3.2-alpine

# The environment and the files are written out per machine: a merge key does not merge
# maps or lists inside.
services:
  etcd-1:
    <<: *etcd
    container_name: ha-etcd-1
    volumes: ["${ABAROW_HA_SECRETS}/m1/tls/ca.pem:/tls/ca.pem:ro", "${ABAROW_HA_SECRETS}/m1/tls/server.pem:/tls/server.pem:ro", "${ABAROW_HA_SECRETS}/m1/tls/server.key:/tls/server.key:ro"]
    environment: &etcd-env
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: https://ha-etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://ha-etcd-1:2380
      ETCD_INITIAL_CLUSTER: etcd-1=https://ha-etcd-1:2380,etcd-2=https://ha-etcd-2:2380,etcd-3=https://ha-etcd-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: abarow-headquarters
      ETCD_LISTEN_CLIENT_URLS: https://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: https://0.0.0.0:2380
      ETCD_DATA_DIR: /etcd-data
      # Clients (Patroni) and the other etcd's must show a certificate of headquarters' CA.
      ETCD_CERT_FILE: /tls/server.pem
      ETCD_KEY_FILE: /tls/server.key
      ETCD_TRUSTED_CA_FILE: /tls/ca.pem
      ETCD_CLIENT_CERT_AUTH: "true"
      ETCD_PEER_CERT_FILE: /tls/server.pem
      ETCD_PEER_KEY_FILE: /tls/server.key
      ETCD_PEER_TRUSTED_CA_FILE: /tls/ca.pem
      ETCD_PEER_CLIENT_CERT_AUTH: "true"
  etcd-2:
    <<: *etcd
    container_name: ha-etcd-2
    volumes: ["${ABAROW_HA_SECRETS}/m2/tls/ca.pem:/tls/ca.pem:ro", "${ABAROW_HA_SECRETS}/m2/tls/server.pem:/tls/server.pem:ro", "${ABAROW_HA_SECRETS}/m2/tls/server.key:/tls/server.key:ro"]
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: https://ha-etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://ha-etcd-2:2380
  etcd-3:
    <<: *etcd
    container_name: ha-etcd-3
    volumes: ["${ABAROW_HA_SECRETS}/m3/tls/ca.pem:/tls/ca.pem:ro", "${ABAROW_HA_SECRETS}/m3/tls/server.pem:/tls/server.pem:ro", "${ABAROW_HA_SECRETS}/m3/tls/server.key:/tls/server.key:ro"]
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: https://ha-etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://ha-etcd-3:2380

  db-1:
    <<: *db
    container_name: ha-db-1
    environment: { ABAROW_NODE: hq-1, ABAROW_NODE_ADDRESS: ha-db-1, ABAROW_ETCD: "ha-etcd-1:2379,ha-etcd-2:2379,ha-etcd-3:2379" }
    volumes: ["${ABAROW_HA_SECRETS}/m1/tls/ca.pem:/etc/abarow/tls/ca.pem:ro", "${ABAROW_HA_SECRETS}/m1/tls/server.pem:/etc/abarow/tls/server.pem:ro", "${ABAROW_HA_SECRETS}/m1/tls/server.key:/etc/abarow/tls/server.key:ro"]
    depends_on: [etcd-1, etcd-2, etcd-3]
  db-2:
    <<: *db
    container_name: ha-db-2
    environment: { ABAROW_NODE: hq-2, ABAROW_NODE_ADDRESS: ha-db-2, ABAROW_ETCD: "ha-etcd-1:2379,ha-etcd-2:2379,ha-etcd-3:2379" }
    volumes: ["${ABAROW_HA_SECRETS}/m2/tls/ca.pem:/etc/abarow/tls/ca.pem:ro", "${ABAROW_HA_SECRETS}/m2/tls/server.pem:/etc/abarow/tls/server.pem:ro", "${ABAROW_HA_SECRETS}/m2/tls/server.key:/etc/abarow/tls/server.key:ro"]
    depends_on: [etcd-1, etcd-2, etcd-3]
  db-3:
    <<: *db
    container_name: ha-db-3
    environment: { ABAROW_NODE: hq-3, ABAROW_NODE_ADDRESS: ha-db-3, ABAROW_ETCD: "ha-etcd-1:2379,ha-etcd-2:2379,ha-etcd-3:2379" }
    volumes: ["${ABAROW_HA_SECRETS}/m3/tls/ca.pem:/etc/abarow/tls/ca.pem:ro", "${ABAROW_HA_SECRETS}/m3/tls/server.pem:/etc/abarow/tls/server.pem:ro", "${ABAROW_HA_SECRETS}/m3/tls/server.key:/etc/abarow/tls/server.key:ro"]
    depends_on: [etcd-1, etcd-2, etcd-3]

  proxy-1:
    <<: *proxy
    container_name: ha-proxy-1
    volumes: ["./ha-db/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro", "${ABAROW_HA_SECRETS}/m1/tls/ca.pem:/etc/abarow/tls/ca.pem:ro"]
  proxy-2:
    <<: *proxy
    container_name: ha-proxy-2
    volumes: ["./ha-db/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro", "${ABAROW_HA_SECRETS}/m2/tls/ca.pem:/etc/abarow/tls/ca.pem:ro"]
  proxy-3:
    <<: *proxy
    container_name: ha-proxy-3
    volumes: ["./ha-db/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro", "${ABAROW_HA_SECRETS}/m3/tls/ca.pem:/etc/abarow/tls/ca.pem:ro"]

secrets:
  db-password:
    file: ${ABAROW_HA_SECRETS:?ABAROW_HA_SECRETS is not set}/db-password
  replication-password:
    file: ${ABAROW_HA_SECRETS:?ABAROW_HA_SECRETS is not set}/replication-password
  restapi-password:
    file: ${ABAROW_HA_SECRETS:?ABAROW_HA_SECRETS is not set}/restapi-password
