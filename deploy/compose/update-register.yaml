# The update center trial (scripts/e2e.sh up update): it is added to the register.
# The register's agent knows only the store server's proxy (it does not know headquarters). Plain HTTP
# is for trial only.
configs:
  register-machine-id: { content: "e2e-register-makine\n" }

services:
  update:
    build:
      context: ../..
      dockerfile: deploy/container/go-service.Containerfile
      args: { MODULE: services/update, PKG: ./cmd/agent }
    image: ghcr.io/abarow/abarow-update:dev
    environment:
      ABAROW_UPDATE_SERVER_URL: http://store-agent:8443
      ABAROW_UPDATE_ALLOW_INSECURE: "1"
      ABAROW_UPDATE_TIER: register
      ABAROW_UPDATE_NAME: ${ABAROW_REGISTER_ID:-register-1}
      ABAROW_STORE_ID: store-1
      ABAROW_REGISTER_ID: ${ABAROW_REGISTER_ID:-register-1}
      ABAROW_UPDATE_DIR: /data
      ABAROW_UPDATE_HOST_ROOT: /host
      GOMEMLIMIT: 24MiB
      # New release flow (trial runtime: real containers are not touched).
      ABAROW_UPDATE_TRUST_FILE: /etc/abarow/trust.json
      ABAROW_UPDATE_RUNTIME: dryrun
      ABAROW_UPDATE_DRYRUN_UNITS: "abarow-sales=ghcr.io/abarow/abarow-sales@sha256:1111111111111111111111111111111111111111111111111111111111111111,abarow-gateway=ghcr.io/abarow/abarow-gateway@sha256:1111111111111111111111111111111111111111111111111111111111111111,abarow-update=ghcr.io/abarow/abarow-update@sha256:1111111111111111111111111111111111111111111111111111111111111111"
      ABAROW_UPDATE_DRYRUN_BAD: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      ABAROW_UPDATE_DRYRUN_PULL: 1s
      ABAROW_UPDATE_HEALTH_TIMEOUT: 8s
      ABAROW_UPDATE_OWN_UNIT: abarow-update
      ABAROW_UPDATE_POLL_INTERVAL: 5s
      ABAROW_UPDATE_APPROVE_SECRET: e2e-onay-gizli
      # It is not applied while a shift is open at the register.
      ABAROW_UPDATE_GATE_URL: http://gateway:8080/api/update/gate
    configs: [{ source: register-machine-id, target: /host/etc/machine-id }]
    volumes:
      - update-data:/data
      - ${ABAROW_E2E_TRUST:-../../tools/e2e/out/trust}/trust.json:/etc/abarow/trust.json:ro
    # The register's network (with the gateway) and the shared network that reaches the store server's proxy.
    networks: [default, store]
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  gateway:
    environment:
      ABAROW_UPDATE_AGENT_URL: http://update:8080
      ABAROW_UPDATE_APPROVE_SECRET: e2e-onay-gizli

volumes:
  update-data:
