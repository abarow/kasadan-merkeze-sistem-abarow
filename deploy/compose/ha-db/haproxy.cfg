# HAProxy of one headquarters machine (Docker test of the database on three machines,
# scripts/ha-db-test.sh). The services connect to their own machine's HAProxy; it sends the
# connection to the machine Patroni says is primary (GET /primary answers 200 only there;
# Patroni's REST API is HTTPS, its certificate is checked with headquarters' CA). The
# PostgreSQL connection itself is TLS from the service to the primary; HAProxy only passes it on.
# When the primary changes the connections to the old one are cut (on-marked-down
# shutdown-sessions): no service keeps writing to a machine that is no longer primary.

global
    maxconn 300

# Docker's name server: a restarted container may get another IP.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode tcp
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 3s

listen primary
    bind :5432
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none check-ssl ca-file /etc/abarow/tls/ca.pem
    server hq-1 ha-db-1:5432 check port 8008
    server hq-2 ha-db-2:5432 check port 8008
    server hq-3 ha-db-3:5432 check port 8008
