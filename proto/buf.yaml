# Lint and breaking change check:
#   go run github.com/bufbuild/buf/cmd/buf@v1.75.0 lint
#   go run github.com/bufbuild/buf/cmd/buf@v1.75.0 breaking --against '../.git#branch=main,subdir=proto'
version: v2
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
